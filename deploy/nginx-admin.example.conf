# Example Nginx location for the local-only Afu Blog admin service.
#
# Run the admin service on the server with:
#   ADMIN_BASE_PATH=/__afu-admin__ SITE_PUBLIC_URL=https://your-domain.com ADMIN_PASSWORD="change-me" npm run admin
#
# Then put this inside your HTTPS server block.

location /__afu-admin__/ {
    auth_basic "Afu Admin";
    auth_basic_user_file /etc/nginx/.afu_admin_htpasswd;

    proxy_pass http://127.0.0.1:8787/__afu-admin__/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
